name: security-gates
# Thin caller of the org-wide reusable security gate in clp-gates.
# fast on PRs into dev; full on PRs into staging/main and on the weekly schedule.
# SARIF + SBOM are uploaded as workflow artifacts (GHAS / code scanning is off).
on:
  pull_request:
    branches: [dev, staging, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    name: security-gates
    permissions:
      contents: read
    # Pinned to clp-gates PR #9 head; re-pin to the dev merge commit after it lands.
    uses: CyberLegionLtd/clp-gates/.github/workflows/security-gates.yml@1630bc45807c9b9380744ba648b837dfa817ce93 # claude/security-gates
    with:
      mode: ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'staging' || github.event.pull_request.base.ref == 'main') && 'full' || 'fast' }}
